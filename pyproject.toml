[project]
name = "nemotron-local-agent"
version = "0.1.0"
description = "Agente local con NVIDIA Nemotron 3 Nano 4B vía Ollama y GPU NVIDIA"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "fernandoog" }]
dependencies = [
    "ollama>=0.4.0",
    "rich>=13.9.0",
    "duckduckgo-search>=7.0.0",
]

[project.scripts]
nemotron-agent = "nemotron_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemotron_agent"]

[tool.hatch.build.targets.sdist]
include = ["src/nemotron_agent", "scripts", "README.md", "LICENSE"]
